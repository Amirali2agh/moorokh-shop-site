name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - shop1
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  django-postgres:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret"
      DJANGO_ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      POSTGRES_DB_NAME: shop_test
      POSTGRES_DB_USER: shop_test
      POSTGRES_DB_PASSWORD: ci-only-password
      POSTGRES_DB_HOST: 127.0.0.1
      POSTGRES_DB_PORT: "5432"
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: shop_test
          POSTGRES_USER: shop_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_test -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Check Django configuration
        working-directory: backend
        run: python manage.py check
      - name: Check migration state
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests against PostgreSQL
        working-directory: backend
        run: python manage.py test shop.tests --verbosity 2
